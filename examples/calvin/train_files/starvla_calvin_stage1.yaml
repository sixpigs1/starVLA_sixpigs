# E-1 Stage 1: Two-stage training — Stage 1 (VLM frozen, action head warm-up)
# Trains only the action model for 5k steps while the VLM backbone is frozen.
# This allows the action head to adapt to the VLM's feature space before
# joint fine-tuning in Stage 2.

run_id: starvla_calvin_stage1
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: calvin_vla_bench
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-VL-0.8B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 7
    state_dim: 8
    action_horizon: 50          # supports replan_steps ∈ [1, 50] at eval time
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/calvin
    data_mix: calvin_task_ABC_D
    action_type: abs_eef
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 5000
  num_warmup_steps: 100
  save_interval: 5000           # saves once at the end
  eval_interval: 5000
  gradient_clipping: 1.0
  freeze_modules: 'qwen_vl_interface'  # freeze VLM, train only action head
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
