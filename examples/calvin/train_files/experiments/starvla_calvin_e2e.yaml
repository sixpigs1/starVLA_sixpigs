# E-2e: Best information combination
# Combines best findings from E-2a/b/c/d:
#   - abs_eef (best action type from E-2)
#   - include_state: true (from E-2a, if positive)
#   - Short history k=3 (from E-2b, if positive)
#   - No delta action (if E-2d showed no benefit)
# Adjust based on actual ablation results!

run_id: starvla_calvin_e2e_best_combo
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: calvin_vla_bench
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_History3         # update based on ablation winner
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-VL-0.8B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 7
    state_dim: 8
    action_horizon: 50
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 2048
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true           # from E-2a winner
    data_root_dir: playground/Datasets/calvin
    data_mix: calvin_task_ABC_D_history3  # from E-2b winner
    action_type: abs_eef
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 25000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 5000
  gradient_clipping: 1.0
  resume_from_checkpoint: results/Checkpoints/starvla_calvin_stage1/step_5000
  freeze_modules: ''
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
